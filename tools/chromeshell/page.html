<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Gerdr Spike</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon.png" />
    <style>
      body { font: 14px -apple-system, system-ui, sans-serif; background: #111; color: #ddd; padding: 16px; }
      button { margin: 4px; padding: 6px 10px; }
      #drop { border: 2px dashed #555; padding: 24px; margin: 12px 0; text-align: center; }
      pre { background: #000; padding: 8px; white-space: pre-wrap; max-height: 50vh; overflow: auto; }
    </style>
  </head>
  <body>
    <h3>Gerdr chrome-shell spike</h3>
    <div>
      <button id="post">bridge postMessage</button>
      <button id="notify">notification (click → focus)</button>
      <button id="badge">badge = 3</button>
      <button id="clear">clear badge</button>
      <button id="pid">renderer pid</button>
      <button id="open">open external URL</button>
      <input type="file" id="pick" multiple />
    </div>
    <div id="drop">drop files / folders here</div>
    <pre id="log"></pre>
    <script>
      const log = (...a) => {
        document.getElementById("log").textContent += a.map((x) => (typeof x === "string" ? x : JSON.stringify(x))).join(" ") + "\n";
      };
      const nat = () => window.gerdrNative;
      log("bridge at load:", !!nat());
      log("display-mode standalone:", matchMedia("(display-mode: standalone)").matches);
      log("UA:", navigator.userAgent);
      log("Notification.permission:", window.Notification && Notification.permission);
      log("setAppBadge:", typeof navigator.setAppBadge);

      document.getElementById("post").onclick = () => nat().postMessage({ type: "hello", at: Date.now() });
      document.getElementById("notify").onclick = async () => {
        const p = await Notification.requestPermission();
        log("permission:", p);
        const n = new Notification("Gerdr Spike", { body: "Click me: the window should come to the front." });
        n.onclick = () => {
          window.focus();
          nat().postMessage({ type: "focus" });
          log("notification clicked");
        };
        log("notification sent");
      };
      document.getElementById("badge").onclick = () =>
        navigator.setAppBadge(3).then(() => log("badge set"), (e) => log("badge error:", String(e)));
      document.getElementById("clear").onclick = () => navigator.clearAppBadge().then(() => log("badge cleared"));
      document.getElementById("pid").onclick = async () => {
        nat().postMessage({ type: "webPid" });
        await new Promise((r) => setTimeout(r, 200));
        log("renderer pid:", window.__GERDR_WEB_PID__);
      };
      document.getElementById("open").onclick = () => nat().postMessage({ type: "open", url: "https://example.com" });

      // Synchronous, like Electron's: the bridge looked the paths up before this handler saw the event.
      const paths = (files) => {
        for (const f of files) log(f.name, "→", nat().getPathForFile(f));
      };
      document.getElementById("pick").onchange = (e) => paths(e.target.files);
      const drop = document.getElementById("drop");
      drop.ondragover = (e) => e.preventDefault();
      drop.ondrop = (e) => {
        e.preventDefault();
        paths(e.dataTransfer.files);
      };
      document.addEventListener("keydown", (e) => {
        if (e.metaKey || e.ctrlKey) log("key:", (e.metaKey ? "⌘" : "^") + e.key, "(reached the page)");
      });
    </script>
  </body>
</html>
