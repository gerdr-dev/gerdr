# 发版：推一个 v 开头的 tag（git tag v0.2.0 && git push origin v0.2.0）就在 GitHub 上打 mac 和安卓的包，挂到同名 Release 上。
# 手动跑（Actions 页面 Run workflow）只打包、不发 Release，包在这次运行的 Artifacts 里，用来试打包有没有坏。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      # 安卓的 versionCode 按 主.次.修 算（见 android/app/build.gradle.kts），tag 必须是 v1.2.3 这样；手动跑没有 tag 时给个占位
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev"; fi
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] || { echo "tag 要是 v主.次.修：$GITHUB_REF_NAME"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

  mac:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 通用 dmg（arm64 + x64）。没配 Apple 开发者证书：build.sh 补 ad-hoc 签名，别人第一次打开要右键「打开」。
      # 以后要正式签名 + 公证：在仓库 Secrets 里配 CSC_LINK / CSC_KEY_PASSWORD（和 APPLE_ID 那几个），在这一步的 env 里传进去
      - run: ./desktop/build.sh mac ${{ needs.version.outputs.version }}
      - run: mv desktop/dist/*.dmg "Gerdr-${{ needs.version.outputs.version }}-mac.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: Gerdr-*.dmg

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # AGP 不认比 21 新的 JDK。Android SDK runner 上自带（ANDROID_HOME）
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # 正式签名钥匙从 Secrets 来（base64 的 jks + 密码）。没配就直接失败：不签的包装不上，
      # 拿别的钥匙签的包和已经装上的 App 签名对不上、升级不上去，passkey 也刷不了（config.OfficialAndroidCert）
      - name: 签名钥匙
        env:
          KEYSTORE_B64: ${{ secrets.GERDR_APP_KEYSTORE_B64 }}
          KEY_PASS: ${{ secrets.GERDR_APP_KEY_PASS }}
        run: |
          [ -n "$KEYSTORE_B64" ] && [ -n "$KEY_PASS" ] || { echo "仓库 Secrets 里没配 GERDR_APP_KEYSTORE_B64 / GERDR_APP_KEY_PASS"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/gerdr.jks"
          echo "GERDR_APP_KEYSTORE=$RUNNER_TEMP/gerdr.jks" >> "$GITHUB_ENV"
          echo "GERDR_APP_KEY_PASS=$KEY_PASS" >> "$GITHUB_ENV"
      - run: cd android && ./gradlew assembleRelease -PappVersion=${{ needs.version.outputs.version }}
      # 签出来的证书必须是官方那把：和 config.OfficialAndroidCert 对一下，Secrets 里放错钥匙在这里就拦住
      - name: 核对签名
        run: |
          want=$(grep -oE 'OfficialAndroidCert *= *"[^"]+"' internal/config/remote.go | grep -oE '[0-9A-F:]{95}' | tr -d ':' | tr A-F a-f)
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          got=$("$apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          echo "want $want"; echo "got  $got"
          [ -n "$want" ] && [ "$want" = "$got" ]
      - run: mv android/app/build/outputs/apk/release/app-release.apk "Gerdr-${{ needs.version.outputs.version }}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Gerdr-*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Gerdr-* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
