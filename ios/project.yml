# Xcode project, generated: `make ios-project` (xcodegen) writes Gerdr.xcodeproj, which isn't in git.
# Design: docs/dev/IOS.md.
name: Gerdr
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Gerdr:
    type: application
    platform: iOS
    sources: [Gerdr]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GERDR_BUNDLE_ID)
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    info:
      path: Gerdr/Info.plist
      properties:
        CFBundleDisplayName: Gerdr
        # The domain this build may use passkeys for (Passkey.entitlements); empty = none, use the browser flow
        GerdrPasskeyDomain: $(GERDR_PASSKEY_DOMAIN)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: Background
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The page's <input type=file> offers "Take Photo / Video"; without these iOS kills the App on that tap
        NSCameraUsageDescription: Take a photo or video to attach to a conversation.
        NSMicrophoneUsageDescription: Record audio for a video or voice input in a conversation.
        # http://localhost / LAN IPs only while debugging against `make dev`; the real address is always https
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Asked the first time LanRoute probes the Mac's LAN port. Denied = always through the relay, silently
        NSLocalNetworkUsageDescription: At home, connect straight to the Gerdr on your computer over Wi-Fi instead of through the relay.
