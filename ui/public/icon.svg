       原稿是 Codex 生图出的方案，描成了矢量；坐标沿用原稿 1024 画布里的位置，所以 viewBox 是从 (75,73) 开始的那块底板。
       App 图标（desktop/res/icon.png）由 make icon 从这份生成，改了这里要重跑。 -->
  <rect x="75" y="73" width="876" height="876" rx="193" fill="#3a3b3e"/>
  <!-- 头 + 两只耳朵 -->
  <path fill="#d1d1d6" d="M512,262 Q560,262 606,272 L700,220 Q712,214 724,218 L828,262 Q846,270 844,290 L832,366 Q828,384 812,376 L782,372 L744,436 L812,570 Q818,592 810,612 L730,740 Q640,800 512,808 Q384,800 294,740 L214,612 Q206,592 212,570 L280,436 L242,372 L212,376 Q196,384 192,366 L180,290 Q178,270 196,262 L300,218 Q312,214 324,220 L418,272 Q464,262 512,262 Z"/>
